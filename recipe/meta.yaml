{% set name = "pyserver" %}
{% set version = "1.1.2" %}

package:
   name: "{{ name }}"
   version: "{{ version }}"

source:
   url: http://software.igwn.org/lscsoft/source/{{ name }}-{{ version }}.tar.gz
   sha256: 8e18efa85987c0ea86b6db57da58acdb81e687595c712d058ea5e014b8625165

build:
  number: 1
  noarch: python
  script: {{ PYTHON }} -m pip install . -vvv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
    - wheel
  run:
    - pymodbus
    - pytango
    - python >={{ python_min }}
    - pythonvirgotools
    - pyusb

test:
  requires:
    - pip
    - python {{ python_min }}
  imports:
    - pyserver
  commands:
    - pip check
    - pip show pyserver

about:
  home: "https://git.ligo.org/virgo/virgoapp/pyserver"
  license: "GPL-2.0-or-later"
  license_family: "GPL"
  license_file: "LICENSE"
  summary: pyserver is a tool to run a custom python server that is fdio compliant

extra:
  recipe-maintainers:
    - duncanmmacleod
    - erinelizabethseder-virgo
    - fcarbogn
